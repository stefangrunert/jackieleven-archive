note: 'Alle 99 Quelldateien wurden ausgewertet: 75 Einzelmeldungen (je ein Dokument) und 24 Sammeldateien
  (21 Nasjonalbiblioteket-Jahresdateien, 2 spanische Hemeroteca-Dateien, 1 Airplay-Sammlung von Music
  Week). Aus den Sammeldateien entstanden 86 Dokumente für frei lesbare Fundstellen mit eigenem Permalink,
  die eine Aussage belegen; die übrigen rund 1.400 Fundstellen (Programm- und Listennennungen, Kalender,
  nicht frei lesbare Ausgaben) wurden nur gezählt. Die Fundstellen selbst wurden ohne Webzugriff nicht
  geöffnet: Grundlage sind die Tabellen und Inhaltsangaben der Sammeldateien, bei den Dokumenten 2007
  bis 2010 nur die Spalte „Art“ (Volltext nicht gesichtet). Deshalb gilt der Bestand als lesbar, nicht
  als vollständig geprüft. Veröffentlichungen (Alben, Singles) wurden nicht erfasst. Die 560 Kandidaten
  sind neue Entitäten (161 Dokumente, 138 Ereignisse, 128 Orte, 59 Personen, 57 Publikationen, 6 Gruppen,
  10 Organisationen, 1 Persona); zusätzlich wurden 40 bestehende Entitäten um Belege ergänzt (31 Ereignisse,
  7 Orte, 1 Gruppe, 1 Person).'
